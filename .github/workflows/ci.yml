name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (informational)
        run: npm audit --omit=dev || true

  e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartfinance
          POSTGRES_PASSWORD: smartfinance
          POSTGRES_DB: smart_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartfinance -d smart_finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      TEST_DATABASE_URL: postgresql://smartfinance:smartfinance@localhost:5432/smart_finance_test?schema=public
      DATABASE_URL: postgresql://smartfinance:smartfinance@localhost:5432/smart_finance_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Run end-to-end tests
        run: npm run test:e2e

  ai:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate dataset splits
        run: python scripts/validate_dataset.py

      - name: Run pytest
        run: pytest

      - name: Train serving artifact from selection.json
        run: python scripts/train.py

      - name: Evaluation smoke (keyword + LR + calibrated SVC)
        run: python scripts/evaluate_models.py --no-report

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: smart-finance/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: smart-finance/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-service/Dockerfile
          push: false
          tags: smart-finance/ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
